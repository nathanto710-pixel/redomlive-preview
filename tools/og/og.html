<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(../assets/anton.woff2) format('woff2')}
@font-face{font-family:Plex;src:url(../assets/plexmono-500.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#4D0032}
.wrap{position:relative;width:1200px;height:630px}
.photo{position:absolute;right:0;top:0;width:760px;height:630px;object-fit:cover;object-position:62% 25%}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#4D0032 0%,#4D0032 38%,rgba(77,0,50,.75) 55%,rgba(77,0,50,0) 80%)}
.txt{position:absolute;left:64px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:22px;width:640px}
.date{font-family:Plex;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#FF7150}
h1{margin:0;font-family:Anton;font-weight:400;font-size:132px;line-height:.92;text-transform:uppercase;color:#FFF3E9}
h1 span{color:#FF7150}
.sub{font-family:Anton;font-size:38px;line-height:1.02;text-transform:uppercase;color:#FFF3E9}
.sub span{color:#FF7150}
.cta{align-self:flex-start;background:#FF7150;color:#4D0032;font-family:Anton;font-size:32px;letter-spacing:.03em;text-transform:uppercase;padding:14px 28px}
</style></head><body><div class="wrap">
<img class="photo" src="../assets/stage-a.jpg">
<div class="fade"></div>
<div class="txt">
<div class="date">Sydney 22-23 Oct · Melbourne 29-30 Oct 2026</div>
<h1>Redom <span>Live</span></h1>
<div class="sub">Your job is gone.<br><span>Your suburb is next.</span></div>
<div class="cta">Get a seat · $49</div>
</div></div></body></html>
